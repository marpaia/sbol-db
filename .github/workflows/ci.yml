name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sbol
          POSTGRES_PASSWORD: sbol
          POSTGRES_DB: sbol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sbol:sbol@localhost:5432/sbol
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  faiss-native:
    runs-on: ubuntu-latest
    env:
      FAISS_DIR: ${{ runner.temp }}/faiss-install
      LD_LIBRARY_PATH: ${{ runner.temp }}/faiss-install/lib
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned FAISS C API
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/faiss-v1.14.3.tar.gz"
          source="$RUNNER_TEMP/faiss-source"
          curl -fsSL -o "$archive" \
            https://github.com/facebookresearch/faiss/archive/refs/tags/v1.14.3.tar.gz
          echo "7f3c4ed9aec3bd7524382862f5fcbd4d8984e2a8979ff3bdb2c0bcea5144149e  $archive" \
            | sha256sum --check --strict
          mkdir -p "$source"
          tar -xzf "$archive" --strip-components=1 -C "$source"
          cmake -S "$source" -B "$source/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$FAISS_DIR" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DFAISS_ENABLE_C_API=ON \
            -DFAISS_ENABLE_CUVS=OFF \
            -DFAISS_ENABLE_GPU=OFF \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DFAISS_OPT_LEVEL=generic
          cmake --build "$source/build" --parallel 2
          cmake --install "$source/build"
      - run: cargo clippy -p sbol-db-search-faiss --all-targets --features native -- -D warnings
      - run: cargo test -p sbol-db-search-faiss --features native
      - run: cargo check -p sbol-db --no-default-features --features faiss

  python-client:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sbol
          POSTGRES_PASSWORD: sbol
          POSTGRES_DB: sbol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sbol:sbol@localhost:5432/sbol
      SQLX_OFFLINE: "true"
      # Exercise the client against both the zero-dependency SQLite backend and
      # the Postgres service; the e2e fixtures parametrize over these.
      SBOL_DB_TEST_BACKENDS: sqlite,postgres
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Lint (isort/black/flake8/mypy)
        working-directory: clients/python
        run: make lint
      - name: End-to-end tests (builds sbol-db, boots it per backend)
        working-directory: clients/python
        run: make e2e

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - name: Fetch chart dependencies
        run: helm dependency build charts/sbol-db
      - name: Lint chart
        run: helm lint --strict charts/sbol-db --set externalDatabase.existingSecret.name=db-creds
      - name: Render — external secret profile
        run: helm template sbol-db charts/sbol-db --set externalDatabase.existingSecret.name=db-creds > /dev/null
      - name: Render — embedded postgres profile
        run: |
          helm template sbol-db charts/sbol-db \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=ci-test \
            > /dev/null
      - name: Render — all optional resources enabled
        run: |
          helm template sbol-db charts/sbol-db \
            --set externalDatabase.existingSecret.name=db-creds \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            > /dev/null
