[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbol-db-client"
version = "0.1.0"
description = "Pure-Python client for the sbol-db HTTP API, with a PartShop-compatible facade."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Mike Arpaia" }]
keywords = ["sbol", "synthetic-biology", "rdf", "sbol-db", "synbiohub"]
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/marpaia/sbol-db"

[project.optional-dependencies]
# Optional generic RDF parsing for callers who want to navigate pulled RDF as a
# graph. This is plain RDF tooling, not an SBOL object model or an sbol-rs
# dependency; the core client never requires it.
rdf = ["rdflib>=7"]
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/sbol_db"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
