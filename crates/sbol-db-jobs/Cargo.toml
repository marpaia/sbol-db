[package]
name = "sbol-db-jobs"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Async job queue and worker runtime for sbol-db."

[dependencies]
sbol-db-core.workspace = true
sbol-db-backup.workspace = true
sbol-db-storage.workspace = true
sbol-db-search = { workspace = true, features = ["text-index", "align"] }
sbol-db-search-sdk.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
reqwest.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures = "0.3"
uuid.workspace = true
metrics.workspace = true
chrono.workspace = true

[dev-dependencies]
age.workspace = true
sbol-db-postgres.workspace = true
sbol-db-sqlite.workspace = true
sbol-db-rocksdb.workspace = true
sbol-db-vector-flat.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
