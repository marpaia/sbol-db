[package]
name = "sbol-db-search"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure ranked-search algorithms for sbol-db: PageRank and the top-level link graph."

[dependencies]
async-trait.workspace = true
sbol-db-core.workspace = true
sbol-db-search-sdk.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tantivy = { workspace = true, optional = true }
bio = { workspace = true, optional = true }

[dev-dependencies]
sbol-db-vector-flat.workspace = true

[features]
default = []
# The tantivy-backed ranked text index. Kept off by default so the storage core,
# which depends on this crate only for the pure link-graph adjacency, never pulls
# tantivy into its build; the sbol-db-app facade enables it to own the index.
text-index = ["dep:tantivy"]
# The rust-bio banded aligner. Off by default so the storage backends, which
# depend on this crate for the pure link-graph adjacency and the pure align /
# cluster domain types, never pull rust-bio into their builds; the search and
# job layers that run alignment enable it.
align = ["dep:bio"]
