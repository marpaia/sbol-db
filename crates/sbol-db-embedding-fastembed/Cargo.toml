[package]
name = "sbol-db-embedding-fastembed"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local FastEmbed/ONNX embedding provider for the sbol-db search SDK."

[dependencies]
async-trait.workspace = true
fastembed.workspace = true
hex.workspace = true
serde.workspace = true
sha3.workspace = true
sbol-db-search-sdk.workspace = true
tokio.workspace = true

[features]
# Native source builds carry the checksum-verified ONNX Runtime selected by the
# locked `ort` crate, so running the resulting binary needs no host library or
# ORT_DYLIB_PATH setup.
default = ["download-ort"]
download-ort = ["fastembed/ort-download-binaries-rustls-tls"]
# Container and other controlled deployments may instead provide the pinned
# runtime dynamically and set ORT_DYLIB_PATH explicitly.
dynamic-ort = ["fastembed/ort-load-dynamic"]
# Enable FastEmbed's Hugging Face model retrieval using rustls. Production
# profiles should use an immutable weight revision/digest in their descriptor.
online-models = ["fastembed/hf-hub-rustls-tls"]

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
