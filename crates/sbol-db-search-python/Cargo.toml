[package]
name = "sbol-db-search-python"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bridge for runtime-loadable Python search plugins in sbol-db."

[dependencies]
async-trait.workspace = true
pyo3 = { version = "0.23.5", features = ["auto-initialize"] }
sbol-db-search.workspace = true
sbol-db-search-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
