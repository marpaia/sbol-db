[package]
name = "sbol-db-ha-test"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "External-process systems testing for RocksDB-backed sbol-db HA clusters."

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
openraft.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sbol-db-core.workspace = true
sbol-db-ha-sim = { path = "../sbol-db-ha-sim" }
sbol-db-raft.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sbol-db-ha-node"
path = "src/bin/node.rs"

[[bin]]
name = "sbol-db-ha-runner"
path = "src/bin/runner.rs"
